[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3forecaster-s3fastsketch"
version = "0.1.0"
description = "Repository-backed S3-Forecaster and S3-FastSketch experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "optuna>=3.5",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["s3paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
